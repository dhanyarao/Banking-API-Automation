name: Banking API Automation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Allow manual trigger from GitHub UI

# Cancel in-progress runs of the same workflow on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # 1. Playwright API Tests (JavaScript)
  # --------------------------------------------------
  playwright:
    name: Playwright API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Install Playwright browsers (not needed for pure API, but safe)
        run: npx playwright install --with-deps chromium

      - name: Create .env from secrets / defaults
        run: |
          cat > config/.env << EOF
          BASE_URL=${{ secrets.BASE_URL || 'https://api.yourbank.com' }}
          USERNAME=${{ secrets.API_USERNAME || 'testuser01' }}
          PASSWORD=${{ secrets.API_PASSWORD || 'SecurePass@123' }}
          ACCOUNT_ID=${{ secrets.ACCOUNT_ID || '1234567890' }}
          FROM_ACCOUNT=${{ secrets.FROM_ACCOUNT || '1234567890' }}
          TO_ACCOUNT=${{ secrets.TO_ACCOUNT || '9876543210' }}
          EOF

      - name: Run Playwright API tests
        run: npx playwright test --reporter=list,html,json
        env:
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright/playwright-report/
          retention-days: 14

      - name: Upload test results (JSON)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: playwright/test-results/
          retention-days: 14

  # --------------------------------------------------
  # 2. Postman + Newman
  # --------------------------------------------------
  newman:
    name: Newman (Postman Collection)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: postman

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Newman + HTML reporter
        run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra

      - name: Run Newman collection
        run: |
          newman run Banking_API_Automation.postman_collection.json \
            -e Banking-Dev.postman_environment.json \
            --env-var "base_url=${{ secrets.BASE_URL || 'https://api.yourbank.com' }}" \
            --env-var "username=${{ secrets.API_USERNAME || 'testuser01' }}" \
            --env-var "password=${{ secrets.API_PASSWORD || 'SecurePass@123' }}" \
            --env-var "account_id=${{ secrets.ACCOUNT_ID || '1234567890' }}" \
            --env-var "from_account=${{ secrets.FROM_ACCOUNT || '1234567890' }}" \
            --env-var "to_account=${{ secrets.TO_ACCOUNT || '9876543210' }}" \
            --delay-request 300 \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export ../newman-report/banking-api-report.html \
            --reporter-junit-export ../newman-report/junit-results.xml \
            --reporter-htmlextra-title "Banking API - Newman CI Report"
        continue-on-error: true

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/
          retention-days: 14

  # --------------------------------------------------
  # 3. Rest Assured (Java)
  # --------------------------------------------------
  rest-assured:
    name: Rest Assured (Java)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: rest-assured

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'

      - name: Run Maven tests
        run: mvn -B clean test
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://api.yourbank.com' }}

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-reports
          path: rest-assured/target/surefire-reports/
          retention-days: 14

  # --------------------------------------------------
  # Summary job
  # --------------------------------------------------
  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [playwright, newman, rest-assured]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "Playwright  → ${{ needs.playwright.result }}"
          echo "Newman      → ${{ needs.newman.result }}"
          echo "Rest Assured→ ${{ needs.rest-assured.result }}"
          echo ""
          echo "All jobs completed. Check the Artifacts tab for HTML reports."
