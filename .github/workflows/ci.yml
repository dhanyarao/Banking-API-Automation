name: Banking API Automation CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  playwright:
    name: Playwright API Tests (Allure)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: playwright
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: playwright/package-lock.json
      - run: npm ci || npm install
      - run: npx playwright install --with-deps chromium
      - name: Create .env from secrets / defaults
        run: |
          cat > config/.env << EOFENV
          BASE_URL=${{ secrets.BASE_URL || 'https://api.yourbank.com' }}
          USERNAME=${{ secrets.API_USERNAME || 'testuser01' }}
          PASSWORD=${{ secrets.API_PASSWORD || 'SecurePass@123' }}
          ACCOUNT_ID=${{ secrets.ACCOUNT_ID || '1234567890' }}
          FROM_ACCOUNT=${{ secrets.FROM_ACCOUNT || '1234567890' }}
          TO_ACCOUNT=${{ secrets.TO_ACCOUNT || '9876543210' }}
          EOFENV
      - name: Download previous Allure history (Playwright)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: allure-history-playwright
          path: playwright/allure-history-prev
          workflow: ci.yml
          workflow_conclusion: completed
          branch: main
          if_no_artifact_found: warn
        continue-on-error: true
      - name: Run Playwright API tests
        run: npx playwright test
        env:
          CI: true
        continue-on-error: true
      - name: Install Allure CLI
        if: always()
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq default-jre-headless
          curl -o allure.tgz -Ls https://repo.maven.apache.org/maven2/io/qameta/allure/allure-commandline/2.27.0/allure-commandline-2.27.0.tgz
          sudo tar -xzf allure.tgz -C /opt/
          sudo ln -sf /opt/allure-2.27.0/bin/allure /usr/local/bin/allure
      - name: Prepare Allure history + generate report
        if: always()
        run: |
          mkdir -p allure-results allure-report
          if [ -d allure-history-prev/history ]; then
            mkdir -p allure-results/history
            cp -r allure-history-prev/history/* allure-results/history/ || true
            echo "Restored Allure history for trends"
          fi
          if [ "$(ls -A allure-results 2>/dev/null | grep -v history)" ]; then
            allure generate allure-results --clean -o allure-report
          else
            echo "<html><body><h2>No Allure results generated</h2></body></html>" > allure-report/index.html
          fi
          mkdir -p allure-history-out
          if [ -d allure-report/history ]; then
            cp -r allure-report/history allure-history-out/
          fi
      - name: Upload Allure Report (Playwright)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-playwright
          path: playwright/allure-report/
          retention-days: 30
      - name: Upload Allure history (for next run trends)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-playwright
          path: playwright/allure-history-out/
          retention-days: 90
          overwrite: true
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-report
          path: playwright/playwright-report/
          retention-days: 14

  newman:
    name: Newman (Postman Collection)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: postman
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: |
          npm install -g newman
          npm install -g newman-reporter-htmlextra
      - name: Run Newman collection
        run: |
          mkdir -p ../newman-report
          newman run Banking_API_Automation.postman_collection.json \
            -e Banking-Dev.postman_environment.json \
            --env-var "base_url=${{ secrets.BASE_URL || 'https://api.yourbank.com' }}" \
            --env-var "username=${{ secrets.API_USERNAME || 'testuser01' }}" \
            --env-var "password=${{ secrets.API_PASSWORD || 'SecurePass@123' }}" \
            --env-var "account_id=${{ secrets.ACCOUNT_ID || '1234567890' }}" \
            --env-var "from_account=${{ secrets.FROM_ACCOUNT || '1234567890' }}" \
            --env-var "to_account=${{ secrets.TO_ACCOUNT || '9876543210' }}" \
            --delay-request 300 \
            --reporters cli,htmlextra,junit \
            --reporter-htmlextra-export ../newman-report/banking-api-report.html \
            --reporter-junit-export ../newman-report/junit-results.xml \
            --reporter-htmlextra-title "Banking API - Newman CI Report"
        continue-on-error: true
      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: newman-report
          path: newman-report/
          retention-days: 14

  rest-assured:
    name: Rest Assured + Allure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: rest-assured
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Download previous Allure history (Rest Assured)
        uses: dawidd6/action-download-artifact@v6
        with:
          name: allure-history-rest-assured
          path: rest-assured/allure-history-prev
          workflow: ci.yml
          workflow_conclusion: completed
          branch: main
          if_no_artifact_found: warn
        continue-on-error: true
      - name: Restore Allure history before tests
        run: |
          mkdir -p target/allure-results
          if [ -d allure-history-prev/history ]; then
            mkdir -p target/allure-results/history
            cp -r allure-history-prev/history/* target/allure-results/history/ || true
          fi
      - name: Run Maven tests
        run: mvn -B clean test
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL || 'https://api.yourbank.com' }}
          API_USERNAME: ${{ secrets.API_USERNAME || 'testuser01' }}
          API_PASSWORD: ${{ secrets.API_PASSWORD || 'SecurePass@123' }}
          ACCOUNT_ID: ${{ secrets.ACCOUNT_ID || '1234567890' }}
          FROM_ACCOUNT: ${{ secrets.FROM_ACCOUNT || '1234567890' }}
          TO_ACCOUNT: ${{ secrets.TO_ACCOUNT || '9876543210' }}
      - name: Generate Allure Report
        if: always()
        run: |
          if [ -d allure-history-prev/history ]; then
            mkdir -p target/allure-results/history
            cp -r allure-history-prev/history/* target/allure-results/history/ || true
          fi
          if [ -d target/allure-results ] && [ "$(ls -A target/allure-results 2>/dev/null | grep -v history)" ]; then
            mvn -B allure:report
          else
            mkdir -p target/site/allure-maven-plugin
            echo "<html><body><h2>No Allure results</h2></body></html>" > target/site/allure-maven-plugin/index.html
          fi
          mkdir -p allure-history-out
          if [ -d target/site/allure-maven-plugin/history ]; then
            cp -r target/site/allure-maven-plugin/history allure-history-out/
          elif [ -d target/allure-report/history ]; then
            cp -r target/allure-report/history allure-history-out/
          fi
      - name: Upload Allure Report (Rest Assured)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-rest-assured
          path: rest-assured/target/site/allure-maven-plugin/
          retention-days: 30
      - name: Upload Allure history (for next run trends)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-history-rest-assured
          path: rest-assured/allure-history-out/
          retention-days: 90
          overwrite: true
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-surefire
          path: rest-assured/target/surefire-reports/
          retention-days: 14

  publish-pages:
    name: Publish Allure to GitHub Pages
    runs-on: ubuntu-latest
    needs: [playwright, rest-assured]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Download Playwright Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-playwright
          path: site/playwright
        continue-on-error: true
      - name: Download Rest Assured Allure report
        uses: actions/download-artifact@v4
        with:
          name: allure-report-rest-assured
          path: site/rest-assured
        continue-on-error: true
      - name: Create index page
        run: |
          mkdir -p site
          cat > site/index.html << 'HTML'
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8" />
            <title>Banking API Automation – Allure Reports</title>
            <style>
              body { font-family: system-ui, sans-serif; max-width: 720px; margin: 60px auto; padding: 0 20px; }
              h1 { color: #0d47a1; }
              .card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 20px; margin: 16px 0; background: #fafafa; }
              a { color: #1565c0; text-decoration: none; font-weight: 600; }
            </style>
          </head>
          <body>
            <h1>Banking API Automation</h1>
            <p>Latest Allure reports (with history/trends when available).</p>
            <div class="card"><h2><a href="./playwright/">Playwright API Tests →</a></h2></div>
            <div class="card"><h2><a href="./rest-assured/">Rest Assured (Java) Tests →</a></h2></div>
            <p>Repo: <a href="https://github.com/dhanyarao/Banking-API-Automation">dhanyarao/Banking-API-Automation</a></p>
          </body>
          </html>
          HTML
          mkdir -p site/playwright site/rest-assured
          [ -f site/playwright/index.html ] || echo "<html><body><h2>Report not available</h2></body></html>" > site/playwright/index.html
          [ -f site/rest-assured/index.html ] || echo "<html><body><h2>Report not available</h2></body></html>" > site/rest-assured/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [playwright, newman, rest-assured]
    if: always()
    steps:
      - run: |
          echo "Playwright   → ${{ needs.playwright.result }}"
          echo "Newman       → ${{ needs.newman.result }}"
          echo "Rest Assured → ${{ needs.rest-assured.result }}"
          echo "Reports → https://dhanyarao.github.io/Banking-API-Automation/"
